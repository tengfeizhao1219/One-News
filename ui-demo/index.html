<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 设计基准页（多项目可扩展）</title>
<style>
  :root {
    --bg-page:#F5F3F0; --bg-card:#FAF9F7; --bg-subtle:#F0EEEA;
    --text-primary:#1C1C1E; --text-secondary:#6B6B70; --text-body:#5E5E60; --text-tertiary:#8A8A8E;
    --text-link:#576b95; --divider:#E8E6E1; --tag-bg:#EEECE8;
    --primary:#007AFF; --primary-subtle:rgba(0,122,255,.12); --highlight-bg:rgba(0,122,255,.06);
    --warning:#F59E0B;
  }
  body.dark {
    --bg-page:#000; --bg-card:#0D0D0D; --bg-subtle:#1A1A1C;
    --text-primary:#FFF; --text-secondary:#999; --text-body:#D4D4D4; --text-tertiary:#666;
    --text-link:#7d93c9; --divider:#1C1C1E; --tag-bg:#1C1C1E;
    --primary:#0A84FF; --primary-subtle:rgba(10,132,255,.18); --highlight-bg:rgba(10,132,255,.10);
    --warning:#FBBF24;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",sans-serif;background:#d9d4cc;min-height:100vh;color:var(--text-primary);}
  body.dark{background:#1a1a1a;}
  .toolbar{position:sticky;top:0;z-index:100;background:rgba(217,212,204,.95);backdrop-filter:blur(8px);padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  body.dark .toolbar{background:rgba(26,26,26,.95);}
  .toolbar .title{font-weight:700;font-size:14px;margin-right:8px;}
  .sep{width:1px;height:24px;background:var(--divider);margin:0 6px;}
  .btn{border:1px solid #ccc;background:#fff;color:#333;padding:7px 14px;border-radius:10px;font-size:13px;cursor:pointer;}
  body.dark .btn{background:#2c2c2e;color:#eee;border-color:#3a3a3c;}
  .btn.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.note-on{background:var(--warning);border-color:var(--warning);color:#fff;}
  .hint{font-size:12px;color:var(--text-tertiary);margin-left:8px;}
  .pages{display:flex;gap:32px;align-items:flex-start;justify-content:center;padding:20px;flex-wrap:wrap;}
  .page-wrap{display:none;} .page-wrap.active{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
  .phone{width:390px;min-height:844px;border-radius:44px;background:var(--bg-page);overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.28);border:8px solid #2c2c2e;flex-shrink:0;display:flex;flex-direction:column;}
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--text-primary);font-size:15px;font-weight:600;flex-shrink:0;}
  .capsule{width:92px;height:28px;background:#000;border-radius:18px;opacity:.9;}
  .nav{display:flex;align-items:center;gap:10px;padding:6px 22px 2px;flex-shrink:0;}
  .nav-home{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-left:-8px;color:var(--text-primary);flex-shrink:0;}
  .nav-home svg{width:24px;height:24px;}
  .nav-dark{display:none;} body.dark .nav-light{display:none;} body.dark .nav-dark{display:block;}
  .scroll{flex:1;overflow-y:auto;padding:0 24px 96px;position:relative;}
  .hero{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 4px;}
  .hero-count{font-size:20px;font-weight:800;} .hero-count b{color:var(--primary);}
  .hero-sub{font-size:12px;color:var(--text-tertiary);text-align:right;} .hero-sub .warn{color:var(--warning);}
  .sect-head{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:12px;}
  .card{background:var(--bg-card);border:1px solid var(--divider);border-radius:16px;padding:16px;margin-bottom:14px;}
  .card-title{display:block;font-size:15px;font-weight:700;line-height:1.45;}
  .focus-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-subtle);padding:3px 9px;border-radius:7px;margin-bottom:8px;}
  .card-for{margin-top:9px;background:var(--highlight-bg);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--text-body);line-height:1.6;}
  .card-for .k{color:var(--primary);font-weight:600;}
  .card-desc{display:block;font-size:12.5px;color:var(--text-tertiary);margin-top:8px;line-height:1.5;}
  .try{display:flex;align-items:flex-start;gap:11px;background:var(--bg-card);border:1px solid var(--divider);border-radius:14px;padding:13px 15px;margin-bottom:12px;}
  .try-check{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--divider);margin-top:2px;flex-shrink:0;}
  .try-check.on{border-color:var(--primary);background:var(--primary);}
  .try-t{font-size:13.5px;} .try-s{font-size:12px;color:var(--text-secondary);margin-top:2px;}
  .detail-title{font-size:19px;font-weight:800;line-height:1.5;}
  .meta{margin-top:8px;font-size:12px;color:var(--text-tertiary);display:flex;gap:12px;} .meta .src{color:var(--text-link);}
  .block-label{display:block;font-size:13px;font-weight:700;color:var(--primary);margin:22px 0 10px;}
  .prose{font-size:13.5px;color:var(--text-body);line-height:1.75;}
  .prose-para{margin-bottom:10px;text-align:justify;}
  /* AI 预测段：很浅底色 + 末尾「AI 预测」标注 */
  .ai-pred{background:var(--highlight-bg);border-radius:10px;padding:11px 14px 9px;margin-top:4px;}
  .ai-pred .pred-text{font-size:13px;color:var(--text-body);line-height:1.7;}
  .ai-pred .pred-tag{display:block;font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:6px;letter-spacing:.5px;/* 与 for-k（落到你这里）保持一致：块内左上 */}
  .for-card{background:var(--highlight-bg);border-radius:12px;padding:13px 15px;margin-bottom:10px;}
  .for-k{display:block;font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:6px;}
  .for-body{font-size:13px;color:var(--text-body);line-height:1.7;}
  .fold{background:var(--bg-card);border:1px solid var(--divider);border-radius:12px;margin-top:12px;overflow:hidden;}
  .fold-head{display:flex;justify-content:space-between;padding:13px 15px;font-size:13.5px;font-weight:600;}
  .deep{margin-top:24px;border-top:1px solid var(--divider);padding-top:16px;}
  .deep-head{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
  .deep-sub{font-size:12px;color:var(--text-tertiary);margin-bottom:12px;}
  .deep-quick{background:var(--bg-card);border:1px solid var(--divider);border-radius:14px;padding:13px 15px;margin-bottom:12px;}
  /* 详情页：标题保留；正文上移（可下滑拉回）；搜索面板从标题下方展开（在 scroll 内随内容滚动） */
  .detail-body{transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .6s;}
  .detail-body.up{transform:translateY(-90px);opacity:.85;}
  .search-panel{position:absolute;top:96px;left:0;right:0;background:var(--bg-page);padding:14px 24px 20px;z-index:210;transform:translateY(-46px);visibility:hidden;opacity:0;transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .6s,visibility 0s .7s;overflow-y:auto;max-height:560px;}
  .search-panel.open{transform:translateY(0);visibility:visible;opacity:1;transition:transform .7s cubic-bezier(.22,.61,.36,1),opacity .6s;}
  /* 搜索悬浮按钮（深入了解入口）：右下角自绘放大镜 */
  .fab-search{position:absolute !important;right:16px !important;bottom:28px;width:48px;height:48px;border-radius:50%;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer;z-index:300;color:var(--text-secondary);transition:transform .15s,background .25s,color .25s;}
  .fab-search:active{transform:scale(.92);}
  .fab-search svg{width:24px;height:24px;}
  .fab-search.on{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.35);}
  .quick-t{font-size:13.5px;font-weight:600;} .quick-s{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
  .search-box{display:flex;gap:10px;background:var(--bg-card);border:1px solid var(--divider);border-radius:14px;padding:11px 13px;margin-bottom:12px;}
  .search-input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px;}
  .search-btn{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;flex-shrink:0;}
  .result{background:var(--bg-card);border:1px solid var(--divider);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .result-t{font-size:13.5px;font-weight:600;} .result-meta{font-size:11px;color:var(--text-tertiary);margin-top:3px;}
  .result-desc{font-size:12px;color:var(--text-body);margin-top:5px;line-height:1.5;}
  .llm{border-radius:12px;background:var(--highlight-bg);padding:13px 15px;margin-bottom:12px;}
  .llm-head{font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:7px;}
  .llm-body{font-size:12.5px;color:var(--text-body);line-height:1.7;}
  .card-action{display:flex;align-items:center;gap:12px;}
  .card-body{flex:1;} .card-t{font-size:14.5px;font-weight:700;} .card-d{font-size:12.5px;color:var(--text-secondary);margin-top:5px;}
  .card-s{font-size:11px;color:var(--text-tertiary);margin-top:5px;} .card-chev{color:var(--text-tertiary);font-size:15px;}
  .revoke{font-size:11.5px;color:#FF3B30;border:1px solid #FF3B30;border-radius:14px;padding:6px 12px;flex-shrink:0;}
  .foot{text-align:center;font-size:11px;color:var(--text-tertiary);padding:18px 0 6px;}
  /* FAB：复刻 One News floating-more（tag-bg 圆 + 浮动动画），「我的」入口 */
  .phone{position:relative;}
  .fab{position:absolute !important;right:16px !important;left:auto !important;bottom:28px;width:48px;height:48px;border-radius:50%;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12);animation:floatY 3.2s ease-in-out infinite;cursor:pointer;z-index:300;}
  .fab:active{transform:scale(.92);animation:none;}
  .fab svg{width:26px;height:26px;}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  /* 标注模式：显性标注线（默认可见，非 hover）+ 编号角标 */
  [data-note]{cursor:pointer;position:relative;}
  body.note-mode [data-note]{outline:1.5px dashed var(--primary);outline-offset:2px;}
  body.note-mode [data-note]::after{
    content:attr(data-idx);position:absolute;top:-7px;left:-7px;width:17px;height:17px;
    background:var(--primary);color:#fff;border-radius:50%;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:50;
  }
  body.note-mode [data-note].lit{outline:2px solid var(--primary);outline-offset:2px;background:var(--primary-subtle);}
  /* 手机 + 说明卡：容器宽度动画实现整体居中（收起=只手机居中，展开=手机+间距+卡整体居中） */
  .demo-row{display:flex;gap:28px;align-items:flex-start;width:390px;overflow:hidden;transition:width .55s cubic-bezier(.22,.61,.36,1);}
  .demo-row.open{width:808px;} /* 390 + 28 + 390 */
  .page-wrap.active .phone{flex-shrink:0;box-shadow:0 24px 60px rgba(0,0,0,.28);}
  .page-wrap.active .phone.dim{box-shadow:-6px 20px 50px rgba(0,0,0,.25);}
  /* 说明卡：与手机完全一致的形态（同边框 8px / 圆角 44px / 状态栏 / 尺寸 390x844） */
  .note-card{
    width:390px;min-height:844px;border-radius:44px;border:8px solid #2c2c2e;background:var(--bg-page);
    box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;flex-shrink:0;
    display:flex;flex-direction:column;opacity:0;transition:opacity .45s ease;
  }
  .demo-row.open .note-card{opacity:1;}
  .nc-head{padding:14px 22px 10px;flex-shrink:0;}
  .nc-name{font-size:17px;font-weight:800;color:var(--text-primary);}
  .nc-sub{font-size:12px;color:var(--text-tertiary);margin-top:3px;}
  .nc-body{flex:1;overflow-y:auto;padding:0 22px 22px;}
  .nc-sec{font-size:10.5px;font-weight:700;color:var(--text-tertiary);letter-spacing:.4px;margin:13px 0 5px;text-transform:uppercase;}
  .nc-intent{font-size:13px;line-height:1.65;color:var(--text-body);}
  .nc-param{background:var(--bg-subtle);border-radius:8px;padding:7px 10px;margin-bottom:5px;font-size:12px;display:flex;justify-content:space-between;gap:10px;}
  .nc-param .k{color:var(--text-secondary);flex-shrink:0;}
  .nc-param .v{color:var(--text-primary);text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;}
  .nc-code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text-link);background:var(--bg-subtle);border-radius:6px;padding:7px 9px;word-break:break-all;line-height:1.5;}
  .nc-guide{font-size:11.5px;color:var(--text-secondary);padding-left:10px;border-left:2px solid var(--primary);margin-top:4px;}
  .nc-copy{width:100%;margin-top:12px;background:var(--bg-subtle);border:1px solid var(--divider);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--text-primary);cursor:pointer;text-align:left;}
  .nc-json{display:none;}
  body.dark .note-card{background:#161618;}
  .note-card .nc-head{padding:14px 16px 10px;flex-shrink:0;}
  .note-card .nc-name{font-size:15px;font-weight:800;}
  .note-card .nc-body{flex:1;overflow-y:auto;padding:0 16px 16px;}
  .nc-sec{font-size:10.5px;font-weight:700;color:var(--text-tertiary);letter-spacing:.4px;margin:12px 0 5px;text-transform:uppercase;}
  .nc-intent{font-size:13px;line-height:1.65;color:var(--text-body);}
  .nc-param{background:var(--bg-subtle);border-radius:8px;padding:7px 10px;margin-bottom:5px;font-size:12px;display:flex;justify-content:space-between;gap:10px;}
  .nc-param .k{color:var(--text-secondary);flex-shrink:0;}
  .nc-param .v{color:var(--text-primary);text-align:right;font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;}
  .nc-code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text-link);background:var(--bg-subtle);border-radius:6px;padding:7px 9px;word-break:break-all;line-height:1.5;}
  .nc-guide{font-size:11.5px;color:var(--text-secondary);padding-left:10px;border-left:2px solid var(--primary);margin-top:4px;}
  .nc-copy{width:100%;margin-top:12px;background:var(--bg-subtle);border:1px solid var(--divider);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--text-primary);cursor:pointer;text-align:left;}
  .nc-json{display:none;}
</style>
</head>
<body>
<div class="toolbar">
  <span class="title">UI 设计基准</span>
  <span class="sep"></span>
  <select id="projectSel" class="btn" onchange="switchProject(this.value)"></select>
  <span class="sep"></span>
  <span id="pageBtns"></span>
  <span class="sep"></span>
  <button class="btn" onclick="toggleTheme()">深浅色</button>
  <button class="btn" id="noteBtn" onclick="toggleNote()">设计标注</button>
  <span class="hint" id="hintText">标注模式：点击元素 → 侧边滑出详细说明与参数</span>
</div>
<div class="pages" id="pages"></div>

<script>
/* =====================================================================
 * 设计标注数据（AI 可读性第一：结构化、字段化、可导出 JSON）
 * 扩展新项目：PROJECTS 加一项 { name, pages: { 页面key: { name, notes: [...] } } }
 * note: { selector, name, intent, params[], code, guideline }
 * ===================================================================*/
const PROJECTS = {
  'ai-intel': {
    name: 'AI 情报官',
    pages: {
      home: {
        name: '首页',
        notes: [
          { selector: '.hero', name: '摘要区', intent: '重点前置：今日条数 + 数据截至单行两端对齐；删除「情报官已完成梳理」类无意义状态条（准则1）', params: [{k:'布局',v:'flex space-between, baseline'},{k:'标题',v:'20px/800'},{k:'副文',v:'12px text-tertiary'}], code: 'hero-count / hero-sub / .hero', guideline: '准则1 简洁形态引导' },
          { selector: '.card:nth-of-type(1)', name: '重点卡（对你最重要）', intent: '仅画像 focusTags 命中（sceneTags∩focusTags）才标记；浅蓝底展示与你画像的关联（focusFor）；不默认第一条', params: [{k:'卡片',v:'bg-card, 1px divider, 16px 圆角'},{k:'间距',v:'卡片间 48rpx'},{k:'tag',v:'primary 文字 + primary-subtle 底, 7px 圆角'}], code: 'card-focus / focus-tag / card-for', guideline: '准则5 风格一致' },
          { selector: '.card:nth-of-type(2)', name: '次级卡', intent: '普通条目卡片：标题 + 单行摘要；来源/时间不在首页（挪详情页，减少噪音）；非重点无 tag/浅蓝底', params: [{k:'卡片',v:'bg-card, 1px divider, 16px 圆角'},{k:'间距',v:'卡片间 48rpx'},{k:'摘要',v:'12.5px text-tertiary, 行距1.5'}], code: 'card / card-desc', guideline: '准则5 风格一致' },
          { selector: '.try', name: '可试用清单项', intent: '细线勾选圆 + 标题 + 最小行动；完成态划线弱化；仅此区块保留标题避免重复', params: [{k:'勾选',v:'19px 圆, 1.5px divider, 选中 primary'},{k:'卡片',v:'14px 圆角'}], code: 'try / try-check', guideline: '准则3 交互可点感' },
          { selector: '.nav', name: '顶部导航', intent: 'Home 图标（复用 One News home.svg/home-dark.svg）+ 无标题；与右上角原生胶囊垂直居中对齐（menu-top/menu-height）', params: [{k:'图标',v:'44px 容器, 24px 图标, 亮黑/暗白'},{k:'对齐',v:'top=menu-top, height=menu-height, flex center'}], code: 'nav-home / .page--dark .nav-light', guideline: '准则4 原生胶囊' },
          { selector: '.fab', name: '悬浮按钮（FAB）', intent: '「我的」入口：完全复刻 One News 首页 floating-more（tag-bg 浅灰圆 + 细阴影 + floatY 浮动动画）；点击进入我的页；深浅色图标跟随主题（CSS 双图标）', params: [{k:'尺寸',v:'48px(96rpx) 圆'},{k:'背景',v:'tag-bg, 阴影 0 2px 10px rgba(0,0,0,.08)'},{k:'位置',v:'右下角, 安全区避让'},{k:'图标',v:'settings.svg 亮色/settings-dark.svg 暗色'}], code: 'floating-more / more-icon-img / .page--dark .more-light', guideline: '准则4 原生设备形态 / 准则2 自绘图标' },
          { selector: '.sect-head', name: '区块标题', intent: '仅「本周可试用清单」保留区块标题（首页卡片区无标题避免重复）；主次分隔用留白而非标题堆叠', params: [{k:'字号',v:'13px/700 text-secondary'},{k:'间距',v:'12px 下边距'}], code: 'sect-head', guideline: '准则1 不重复设计' },
          { selector: '.foot', name: '页脚', intent: '统一页脚「由 AI 情报官生成 · 仅供参考」；弱化、居中小字', params: [{k:'字号',v:'11px text-tertiary'},{k:'对齐',v:'居中'}], code: 'foot-note', guideline: '准则1 简洁' },
        ]
      },
      detail: {
        name: '详情页',
        notes: [

let curProject = 'ai-intel';
let curPage = 'home';
let noteMode = false;

function switchProject(pid){ curProject = pid; curPage = 'home'; renderToolbar(); renderPages(); showPage('home'); }
function renderToolbar(){
  const sel = document.getElementById('projectSel');
  sel.innerHTML = Object.keys(PROJECTS).map(k => `<option value="${k}" ${k===curProject?'selected':''}>${PROJECTS[k].name}</option>`).join('');
  document.getElementById('pageBtns').innerHTML = Object.keys(PROJECTS[curProject].pages).map(k =>
    `<button class="btn" id="pg-${k}" onclick="showPage('${k}')">${PROJECTS[curProject].pages[k].name}</button>`).join('');
}
function renderPages(){
  const holder = document.getElementById('pages');
  holder.innerHTML = Object.keys(PROJECTS[curProject].pages).map(k =>
    `<div class="page-wrap" id="wrap-${k}">
       <div class="demo-row" id="row-${k}">
         <div class="phone">${PAGE_HTML[k]}</div>
         <div class="note-card">
           <div class="statusbar"><span>9:41</span><span class="capsule"></span></div>
           <div class="nc-head"><div class="nc-name" id="ncName"></div><div class="nc-sub">设计说明 · AI 情报官 UI</div></div>
           <div class="nc-body" id="ncBody"></div>
         </div>
       </div>
     </div>`).join('');
  // 给标注元素编号（显性标注线的角标序号，与 notes 顺序对应）
  Object.keys(PROJECTS[curProject].pages).forEach(k => {
    const notes = PROJECTS[curProject].pages[k].notes || [];
    const wrap = document.getElementById('wrap-'+k);
    if(!wrap) return;
    notes.forEach((n, i) => {
      let el = null;
      if(n.selector.includes(':nth-of-type')){
        const [base, nth] = n.selector.split(':nth-of-type(');
        const els = wrap.querySelectorAll(base.trim());
        el = els[parseInt(nth)-1];
      } else {
        el = wrap.querySelector(n.selector);
      }
      if(el){ el.setAttribute('data-idx', String(i+1)); el.setAttribute('data-note',''); }
    });
  });
}
function showPage(name){
  curPage = name;
  Object.keys(PROJECTS[curProject].pages).forEach(k=>{
    document.getElementById('wrap-'+k).classList.toggle('active', k===name);
    const b = document.getElementById('pg-'+k); if(b) b.classList.toggle('on', k===name);
  });
}
function toggleTheme(){ document.body.classList.toggle('dark'); }
function toggleNote(){
  noteMode = !noteMode;
  document.body.classList.toggle('note-mode', noteMode);
  document.getElementById('noteBtn').classList.toggle('note-on', noteMode);
  document.getElementById('hintText').textContent = noteMode ? '标注模式：点击元素 → 侧边滑出详细说明' : '标注模式：点击元素查看设计意图与代码位置';
}
function closeDrawer(){
  document.querySelectorAll('.demo-row.open').forEach(r=>r.classList.remove('open'));
  document.querySelectorAll('.phone.dim').forEach(p=>p.classList.remove('dim'));
  document.querySelectorAll('[data-note].lit').forEach(e=>e.classList.remove('lit'));
}
document.addEventListener('click', function(e){
  // 非标注模式：处理手机内可交互动作（返回主页/进详情/进初始化/深入了解），页面标签同步切换
  if(!noteMode){
    const actEl = e.target.closest('[data-action]');
    if(actEl){
      const act = actEl.getAttribute('data-action');
      closeDrawer();
      if(act === 'home') showPage('home');
      else if(act === 'detail') showPage('detail');
      else if(act === 'mine') showPage('mine');
      else if(act === 'deep') showPage('deep');
      else if(act === 'onboard') showPage('onboard');
      else if(act === 'search'){
        const phone = actEl.closest('.phone');
        const body = phone.querySelector('.detail-body');
        const panel = phone.querySelector('.search-panel');
        if(!phone.classList.contains('search-on')){
          phone.classList.add('search-on');
          if(body) body.classList.add('up');
          if(panel) panel.classList.add('open');
          actEl.classList.add('on');
        } else {
          phone.classList.remove('search-on');
          if(body) body.classList.remove('up');
          if(panel) panel.classList.remove('open');
          actEl.classList.remove('on');
        }
      }
      return;
    }
    return;
  }
  // 标注模式
  const el = e.target.closest('[data-note]');
  document.querySelectorAll('[data-note].lit').forEach(x=>x.classList.remove('lit'));
  if(el){
    el.classList.add('lit');
    const notes = (PROJECTS[curProject].pages[curPage] || {}).notes || [];
    const cls = (el.className.baseVal !== undefined ? el.className.baseVal : el.className) || '';
    const idx = el.getAttribute('data-idx');
    let note = idx ? notes[parseInt(idx)-1] : null;
    if(!note) note = notes.find(n => cls.split(' ').some(c => n.selector.replace('.','').split(' ')[0] === c));
    if(!note) note = notes[0];
    // 容器宽度展开：手机+说明卡整体居中，说明卡从手机右侧滑出
    document.querySelectorAll('.page-wrap.active .demo-row').forEach(r => r.classList.add('open'));
    document.querySelectorAll('.page-wrap.active .phone').forEach(p => p.classList.add('dim'));
    openDrawer(note || { name:'元素', intent:'（暂无标注，请在 PROJECTS 数据中补充）', params:[], code:'—', guideline:'—' });
  } else { closeDrawer(); }
});
function openDrawer(note){
  const wrap = document.querySelector('.page-wrap.active');
  if(!wrap) return;
  const body = wrap.querySelector('.nc-body');
  const name = wrap.querySelector('.nc-name');
  name.textContent = note.name || '元素说明';
  body.innerHTML = `
    <div class="nc-sec">设计意图</div><div class="nc-intent">${note.intent}</div>
    <div class="nc-sec">关键参数</div>
    ${(note.params||[]).map(p=>`<div class="nc-param"><span class="k">${p.k}</span><span class="v">${p.v}</span></div>`).join('')}
    <div class="nc-sec">小程序代码位置</div><div class="nc-code">${note.code}</div>
    <div class="nc-sec">设计准则</div><div class="nc-guide">${note.guideline}</div>
    <div class="nc-sec">标注数据（AI 可读）</div>
    <button class="nc-copy" onclick="copyNote()">复制标注 JSON（可直接粘贴给 AI）</button>
    <pre class="nc-json" id="noteJson">${escapeHtml(JSON.stringify({project:curProject,page:curPage,...note},null,1))}</pre>`;
  card.classList.add('open');
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyNote(){
  const pre = document.getElementById('noteJson');
  if(navigator.clipboard && pre){ navigator.clipboard.writeText(pre.textContent).then(()=>{ alert('已复制标注 JSON'); }); }
}
renderToolbar(); renderPages(); showPage('home');
if(location.search.includes('dark=1')) document.body.classList.add('dark');
</script>
</body>
