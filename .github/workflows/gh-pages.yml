# 部署 ui-demo 静态站到 GitHub Pages
# 触发：push 到 main（ui-demo/ 目录变更）；可手动 re-run
name: deploy-ui-demo

on:
  push:
    branches: [main]
    paths: ['ui-demo/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui-demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
