<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>一页 One News · 项目全局看板</title>
<style>
  :root{
    --bg:#f5f3ee; --panel:#fffdf9; --ink:#1c1b19; --sub:#6b6862;
    --line:#e7e2d8; --accent:#007aff; --chip:#eeece8; --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
    --done:#2e9e5b; --doing:#e0a106; --wait:#9a958c; --block:#d6453d; --cancel:#9a958c;
  }
  [data-theme="dark"]{
    --bg:#0f0f10; --panel:#1a1a1c; --ink:#ececec; --sub:#9a978f;
    --line:#2c2c2f; --accent:#4ea1ff; --chip:#262629; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --done:#3fbf73; --doing:#e6b23a; --wait:#7d7970; --block:#ef5b52; --cancel:#7d7970;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  header{padding:18px 22px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
    background:var(--bg);backdrop-filter:blur(6px)}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
  .sub{color:var(--sub);font-size:12px;margin-top:3px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .stats{display:flex;gap:6px;flex-wrap:wrap}
  .stat{font-size:12px;color:var(--sub);background:var(--chip);border-radius:20px;padding:3px 10px}
  .stat b{color:var(--ink)}
  .spacer{flex:1}
  button{font-family:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent)}
  #chain{margin-top:10px;display:none;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--chip);border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;font-size:12px}
  #chain.show{display:flex}
  #chain .ck{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
  #chain .ck .dot{width:8px;height:8px;border-radius:50%}
  .board{display:flex;gap:14px;padding:16px 22px 40px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 270px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 180px)}
  .col-head{padding:12px 14px;border-bottom:1px solid var(--line)}
  .col-head .cn{font-weight:700;font-size:14px}
  .col-head .ch{color:var(--sub);font-size:11px;margin-top:2px}
  .col-body{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;
    transition:.15s;position:relative}
  .card:hover{transform:translateY(-1px);border-color:var(--accent)}
  .card .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .id{font-size:11px;font-weight:700;color:var(--accent);font-family:ui-monospace,monospace}
  .prio{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
  .p0{background:#fde8e6;color:#c43c33}.p1{background:#fdf3e0;color:#a9791a}.p2{background:#eef2f7;color:#3a6ea5}.pn{background:var(--chip);color:var(--sub)}
  [data-theme="dark"] .p0{background:#3a1f1d;color:#ff8a80}[data-theme="dark"] .p1{background:#3a2f17;color:#f0c46a}[data-theme="dark"] .p2{background:#1f2937;color:#8ab4f8}
  .st{margin-left:auto;font-size:13px}
  .tt{font-size:13px;line-height:1.4;font-weight:600}
  .meta{margin-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .role{font-size:11px;color:var(--sub)}
  .link{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;color:#fff;opacity:.92}
  .note{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.35}
  /* 关联高亮 */
  .board.linked .card{opacity:.32;filter:saturate(.4)}
  .board.linked .card.linked{opacity:1;filter:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  .board.linked .col-head{opacity:.5}
  .board.linked .col.has-linked .col-head{opacity:1}
  /* ===== 列筛选：点击列头/统计条只显示该列 ===== */
  .col.filtered-out{display:none!important}
  .col-head.filter-active,.stat.active{
    border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 12%,var(--panel))!important;
    box-shadow:0 0 0 1px var(--accent)
  }
  .stat{cursor:pointer;transition:.15s;border-radius:8px;padding:3px 10px}
  .stat:hover{background:var(--chip)}
  .stat.active{background:var(--accent);color:#fff}
  #filterReset{display:none;font-size:11px;color:var(--sub);cursor:pointer;
    padding:2px 10px;border:1px solid var(--line);border-radius:8px;align-self:center}
  #filterReset:hover{border-color:var(--accent);color:var(--accent)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);padding:0 22px 18px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  footer{padding:14px 22px 30px;color:var(--sub);font-size:11px;border-top:1px solid var(--line)}
  a{color:var(--accent);text-decoration:none}
  /* 任务详情底部抽屉（点击卡片滑出） */
  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:60}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;background:var(--panel);
    border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);
    z-index:61;display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0)}
  .sheet-hd{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .sheet-hd .sid{font-size:12px;font-weight:700;color:var(--accent);font-family:ui-monospace,monospace}
  .sheet-hd .stt{font-size:13px;margin-left:auto;white-space:nowrap}
  .sheet-hd .ttl{font-size:15px;font-weight:700;margin:4px 0 0;line-height:1.35;flex:1}
  .sheet-close{margin-left:6px;font-size:18px;line-height:1;background:none;border:none;
    color:var(--sub);cursor:pointer;padding:2px 6px}
  .sheet-bd{padding:12px 18px calc(26px + env(safe-area-inset-bottom));overflow-y:auto}
  .sheet-bd .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .sheet-bd .kv{font-size:12px;color:var(--sub);background:var(--chip);border-radius:8px;padding:3px 9px}
  .sheet-bd .kv b{color:var(--ink)}
  .sheet-bd h4{margin:16px 0 7px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .sheet-bd .bg{font-size:13px;line-height:1.65;color:var(--ink)}
  .sheet-bd .cl{display:flex;flex-direction:column;gap:8px}
  .sheet-bd .cl-i{border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;padding:7px 10px}
  .sheet-bd .cl-i .t{font-size:11px;color:var(--sub)}
  .sheet-bd .cl-i .who{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;
    background:var(--accent);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .sheet-bd .cl-i .c{font-size:12.5px;line-height:1.45;margin-top:4px;color:var(--ink)}
  .sheet-bd .empty{font-size:12.5px;color:var(--sub);font-style:italic}
  .sheet-link-btn{margin-top:16px;width:100%;justify-content:center;padding:9px 12px}
  /* 状态编辑器 */
  .sheet-bd .st-edit{margin-top:18px}
  .sheet-bd .st-edit h4{margin-bottom:8px}
  .sheet-bd .st-btns{display:flex;gap:6px;flex-wrap:wrap}
  .sheet-bd .st-btn{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--chip);color:var(--ink);cursor:pointer;transition:.15s}
  .sheet-bd .st-btn:hover{border-color:var(--accent)}
  .sheet-bd .st-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .sheet-bd .doc-btns{display:flex;gap:8px;margin-top:12px}
  .sheet-bd .doc-btns .sheet-link-btn{margin-top:0}
  /* Token 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:80}
  .modal-mask.show{display:flex}
  .modal{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px 20px;width:min(440px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 4px;font-size:15px}
  .modal .sub{font-size:12px;color:var(--sub);margin-bottom:8px}
  .modal input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:13px;margin:4px 0;box-sizing:border-box}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .modal .hint{font-size:11.5px;color:var(--sub);line-height:1.55;margin-top:10px}
  .modal .mstatus{font-size:12px;margin-top:8px;min-height:16px}
  .modal .mstatus.ok{color:var(--done)} .modal .mstatus.err{color:var(--block)}
  /* Toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,22,28,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1 id="title">一页 One News · 项目全局看板</h1>
  <div class="sub" id="subtitle"></div>
  <div class="bar">
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <button id="refreshBtn" title="重新从仓库拉取任务数据">🔄 刷新</button>
    <button id="syncBtn" title="设置 GitHub Token 以在网页改状态并回写 git">🔧 同步</button>
    <span id="filterReset">⊗ 显示全部</span>
    <button id="resetBtn" style="display:none">退出关联</button>
    <button id="themeBtn">🌙 暗色</button>
  </div>
  <div id="chain"></div>
</header>

<div class="board" id="board"></div>

<div class="legend" id="legend"></div>

<footer>
  数据源：<code>tasks.json</code>（每次刷新实时拉取，可点 🔧 同步 填入 Token 后在网页直接改状态并回写 git）+ <code>COMMLOG.md</code>（背景与最近变更）·
  点击任意卡片查看任务详情（背景 + 最近 3 条变更 + 关联链 + GitHub 文档）；详情内可更新状态。
</footer>

<div class="sheet-mask" id="sheetMask"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-hd">
    <div>
      <span class="sid" id="sheetId"></span>
      <div class="ttl" id="sheetTitle"></div>
    </div>
    <span class="stt" id="sheetStatus"></span>
    <button class="sheet-close" id="sheetClose" aria-label="关闭">✕</button>
  </div>
  <div class="sheet-bd" id="sheetBody"></div>
</aside>

<!-- Token 设置弹窗 -->
<div class="modal-mask" id="tokenMask">
  <div class="modal">
    <h3>🔧 同步设置（GitHub Token）</h3>
    <div class="sub">用于在网页直接修改任务状态并回写 git</div>
    <input id="tokenInput" type="password" placeholder="ghp_... 或 github_pat_..." autocomplete="off" spellcheck="false" />
    <div class="mstatus" id="tokenStatus"></div>
    <div class="row">
      <button id="tokenClear">清除</button>
      <button id="tokenSave">保存</button>
      <button id="tokenClose">关闭</button>
    </div>
    <div class="hint">Token 仅保存在本机浏览器（localStorage），仅发往 <code>api.github.com</code>，不上传任何第三方。需要 <b>repo</b> 权限（对当前仓库的读写）。清除后本机不再保留。</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="tasklog.js"></script>
<script src="data.js"></script>
<script>
(async function(){
  // 拉取可变任务源 tasks.json（权威，每次加载实时拉取）；失败回退 data.js 静态快照
  try{
    const r=await fetch('tasks.json',{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j&&j.tasks){ window.KANBAN_META=j.meta||window.KANBAN_META; window.KANBAN_DATA=j.tasks; } }
  }catch(e){ /* 保留 data.js 全局兜底 */ }
  renderBoard();
  function renderBoard(){
    const META = window.KANBAN_META, DATA = window.KANBAN_DATA;
  const statusMap = {done:"✅",doing:"🔄",wait:"⏳",block:"🚫",cancel:"❌"};
  const statusColor = {done:"var(--done)",doing:"var(--doing)",wait:"var(--wait)",block:"var(--block)",cancel:"var(--cancel)"};

  // 关联链配色
  const links = [...new Set(DATA.map(d=>d.link))];
  const linkColor = {};
  links.forEach((l,i)=>{ const h = (i*67+200)%360; linkColor[l] = `hsl(${h} 62% 52%)`; });

  document.getElementById("title").textContent = META.title;
  document.getElementById("subtitle").textContent = META.subtitle + " · 更新 " + META.updated;

  // 任务详情（点击卡片滑出底部抽屉）：任务背景 + 该任务最近 3 条变更
  const esc = s => (s==null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const sheet = document.getElementById("sheet");
  const sheetMask = document.getElementById("sheetMask");
  const sId = document.getElementById("sheetId");
  const sTitle = document.getElementById("sheetTitle");
  const sStatus = document.getElementById("sheetStatus");
  const sBody = document.getElementById("sheetBody");
  function openDetail(d){
    const tl = (window.KANBAN_TASKLOG && window.KANBAN_TASKLOG[d.id]) || null;
    const bg = (tl && tl.background) ? tl.background : (d.note || "暂无背景说明（COMMLOG 中未检索到该任务 ID）。");
    const log = tl ? tl.log : [];
    sId.textContent = d.id;
    sTitle.textContent = d.title;
    sStatus.textContent = (statusMap[d.status]||"") + " " + d.status;
    sStatus.style.color = statusColor[d.status] || "";
    let h = '<div class="row">'
      + '<span class="kv">负责：<b>'+esc(d.role)+'</b></span>'
      + '<span class="kv">优先级：<b>'+esc(d.prio)+'</b></span>'
      + '<span class="kv">更新：<b>'+esc(d.updated)+'</b></span>'
      + '<span class="kv">关联链：<b>'+esc(d.link)+'</b></span>'
      + '</div>';
    h += '<h4>📖 任务背景</h4><div class="bg">'+esc(bg)+'</div>';
    h += '<h4>🕘 最近变更（COMMLOG 最新 3 条）</h4>';
    if(log.length){
      h += '<div class="cl">';
      log.forEach(e=>{
        h += '<div class="cl-i"><div class="t">'+esc(e.time)+'<span class="who">'+esc(e.who||"—")+'</span></div><div class="c">'+esc(e.content)+'</div></div>';
      });
      h += '</div>';
    } else {
      h += '<div class="empty">暂无变更记录（COMMLOG 中未检索到任务 ID '+esc(d.id)+'）</div>';
    }
    h += '<button class="sheet-link-btn" id="sheetLinkBtn">🔗 查看关联链（'+esc(d.link)+'）</button>';
    // 文档按钮（功能②）：GitHub 源 + 渲染页
    if(d.doc){
      h += '<div class="doc-btns">'
        + '<button class="sheet-link-btn" id="docBtn">📄 在 GitHub 查看文档</button>'
        + '<button class="sheet-link-btn" id="docPageBtn">🌐 查看渲染页</button>'
        + '</div>';
    }
    // 状态编辑器（功能①）
    const STATUSES=[["done","✅ 已完成"],["doing","🔄 进行中"],["wait","⏳ 等待"],["block","🚫 阻塞"],["cancel","❌ 已取消"]];
    h += '<div class="st-edit"><h4>📝 更新状态</h4><div class="st-btns">';
    STATUSES.forEach(([k,lab])=>{ h += '<button class="st-btn'+(d.status===k?' on':'')+'" data-st="'+k+'">'+lab+'</button>'; });
    h += '</div></div>';
    sBody.innerHTML = h;
    document.getElementById("sheetLinkBtn").addEventListener("click", ()=>{ closeSheet(); focusLink(d.link); });
    if(d.doc){
      document.getElementById("docBtn").addEventListener("click", ()=>window.open(d.doc,"_blank","noopener"));
      document.getElementById("docPageBtn").addEventListener("click", ()=>window.open("https://tengfeizhao1219.github.io/One-News/tasks/"+encodeURIComponent(d.id)+".html","_blank","noopener"));
    }
    sBody.querySelectorAll(".st-btn").forEach(b=>{
      b.addEventListener("click", ()=>{ const st=b.dataset.st; if(st===d.status) return; updateStatus(d.id,st); });
    });
    sheet.classList.add("show"); sheetMask.classList.add("show"); sheet.setAttribute("aria-hidden","false");
    sBody.scrollTop = 0;
  }
  function closeSheet(){
    sheet.classList.remove("show"); sheetMask.classList.remove("show"); sheet.setAttribute("aria-hidden","true");
  }
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  sheetMask.addEventListener("click", closeSheet);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

  // 统计
  const statsEl = document.getElementById("stats");
  META.columns.forEach(c=>{
    const n = DATA.filter(d=>d.col===c.key).length;
    const s = document.createElement("span"); s.className="stat";
    s.innerHTML = c.name+" <b>"+n+"</b>"; statsEl.appendChild(s);
  });

  // 渲染看板
  const board = document.getElementById("board");
  META.columns.forEach(c=>{
    const col = document.createElement("div"); col.className="col"; col.dataset.col=c.key;
    const head = document.createElement("div"); head.className="col-head";
    head.innerHTML = `<div class="cn">${c.name}</div><div class="ch">${c.hint}</div>`;
    col.appendChild(head);
    const body = document.createElement("div"); body.className="col-body";
    DATA.filter(d=>d.col===c.key).forEach(d=> body.appendChild(makeCard(d)));
    col.appendChild(body); board.appendChild(col);
  });

  function makeCard(d){
    const el = document.createElement("div"); el.className="card"; el.dataset.link=d.link; el.dataset.id=d.id;
    const prioCls = d.prio==="P0"?"p0":d.prio==="P1"?"p1":d.prio==="P2"?"p2":"pn";
    el.innerHTML = `
      <div class="top">
        <span class="id">${d.id}</span>
        <span class="prio ${prioCls}">${d.prio}</span>
        <span class="st" style="color:${statusColor[d.status]}">${statusMap[d.status]}</span>
      </div>
      <div class="tt">${d.title}</div>
      <div class="meta">
        <span class="role">${d.role}</span>
        <span class="link" style="background:${linkColor[d.link]}">🔗 ${d.link}</span>
      </div>
      ${d.note?`<div class="note">${d.note}</div>`:""}`;
    el.addEventListener("click",()=>openDetail(d));
    return el;
  }

  // 关联高亮
  const chainEl = document.getElementById("chain");
  const resetBtn = document.getElementById("resetBtn");
  function focusLink(link){
    board.classList.add("linked");
    resetBtn.style.display="";
    document.querySelectorAll(".card").forEach(c=>{
      c.classList.toggle("linked", c.dataset.link===link);
    });
    document.querySelectorAll(".col").forEach(col=>{
      col.classList.toggle("has-linked", [...col.querySelectorAll(".card.linked")].length>0);
    });
    // 关联链横幅
    const order = {}; META.columns.forEach((c,i)=>order[c.key]=i);
    const items = DATA.filter(d=>d.link===link).sort((a,b)=>order[a.col]-order[b.col]);
    let html = `<b style="color:${linkColor[link]}">🔗 ${link}</b> 关联链：`;
    META.columns.forEach(c=>{
      const t = items.find(x=>x.col===c.key);
      html += `<span class="ck"><span class="dot" style="background:${t?statusColor[t.status]:'var(--line)'}"></span>${c.name.slice(0,2)} ${t?statusMap[t.status]:'—'}</span>`;
    });
    chainEl.innerHTML = html; chainEl.classList.add("show");
  }
  function resetFocus(){
    board.classList.remove("linked");
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("linked"));
    document.querySelectorAll(".col").forEach(col=>col.classList.remove("has-linked"));
    chainEl.classList.remove("show"); resetBtn.style.display="none";
  }
  resetBtn.addEventListener("click",resetFocus);
  board.addEventListener("click",e=>{ if(e.target===board) resetFocus(); });

  // 图例
  const legend = document.getElementById("legend");
  links.forEach(l=>{
    const s=document.createElement("span");
    s.innerHTML=`<i style="background:${linkColor[l]}"></i>${l}`;
    legend.appendChild(s);
  });

  // 主题
  const themeBtn=document.getElementById("themeBtn");
  themeBtn.addEventListener("click",()=>{
    const dark=document.documentElement.getAttribute("data-theme")==="dark";
    document.documentElement.setAttribute("data-theme",dark?"light":"dark");
    themeBtn.textContent=dark?"🌙 暗色":"☀️ 亮色";
  });

  /* ===== 列筛选：点击列头或统计条只显示该列 ===== */
  let filterCol=null;
  const fReset=document.getElementById("filterReset");
  function applyFilter(colKey){
    filterCol=colKey;
    document.querySelectorAll(".col").forEach(c=>{
      const on=colKey===null||c.dataset.col===colKey;
      c.classList.toggle("filtered-out",!on);
      c.querySelector(".col-head")?.classList.toggle("filter-active",on&&colKey!==null);
    });
    document.querySelectorAll(".stat").forEach((s,i)=>{
      s.classList.toggle("active",colKey!==null&&meta.columns[i]&&meta.columns[i].key===colKey);
    });
    fReset.style.display=colKey!==null?"":"none";
  }
  fReset.addEventListener("click",()=>applyFilter(null));
  // 列头点击
  board.addEventListener("click",e=>{
    const h=e.target.closest(".col-head");
    if(!h)return;
    const col=h.closest(".col").dataset.col;
    applyFilter(filterCol===col?null:col);
  });
  // 统计条点击
  document.getElementById("stats").addEventListener("click",e=>{
    const s=e.target.closest(".stat"); if(!s)return;
    const idx=[...document.getElementById("stats").children].indexOf(s), c=meta.columns[idx];
    if(c) applyFilter(filterCol===c.key?null:c.key);
  });

  /* ===== 刷新 / 同步按钮 ===== */
  document.getElementById("refreshBtn").addEventListener("click",()=>location.reload());
  document.getElementById("syncBtn").addEventListener("click",openTokenModal);

  /* ===== Token 设置（仅存本机 localStorage） ===== */
  const TOKEN_KEY="kanban_gh_token";
  function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||""; }catch(e){ return ""; } }
  const tokenMask=document.getElementById("tokenMask"), tokenInput=document.getElementById("tokenInput"),
        tokenStatus=document.getElementById("tokenStatus"), tokenSave=document.getElementById("tokenSave"),
        tokenClear=document.getElementById("tokenClear"), tokenClose=document.getElementById("tokenClose");
  function openTokenModal(){
    tokenInput.value=getToken();
    tokenStatus.textContent=getToken()?"已保存 Token（仅本机）":"尚未保存 Token";
    tokenStatus.className="mstatus"+(getToken()?" ok":"");
    tokenMask.classList.add("show");
    setTimeout(()=>tokenInput.focus(),50);
  }
  function closeTokenModal(){ tokenMask.classList.remove("show"); }
  tokenClose.addEventListener("click",closeTokenModal);
  tokenMask.addEventListener("click",e=>{ if(e.target===tokenMask) closeTokenModal(); });
  tokenSave.addEventListener("click",()=>{
    const v=tokenInput.value.trim();
    if(!v){ tokenStatus.textContent="Token 为空，未保存"; tokenStatus.className="mstatus err"; return; }
    try{ localStorage.setItem(TOKEN_KEY,v); }catch(e){ tokenStatus.textContent="保存失败："+e.message; tokenStatus.className="mstatus err"; return; }
    tokenStatus.textContent="✅ 已保存（仅本机浏览器，只发往 api.github.com）"; tokenStatus.className="mstatus ok";
    setTimeout(closeTokenModal,900);
  });
  tokenClear.addEventListener("click",()=>{
    try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
    tokenInput.value=""; tokenStatus.textContent="已清除本机 Token"; tokenStatus.className="mstatus";
  });

  /* ===== 写回：把状态变更提交到 tasks.json（GitHub Contents API） ===== */
  function b64decodeUtf8(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0))); }
  function b64encodeUtf8(str){ const bytes=new TextEncoder().encode(str); let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return btoa(bin); }
  function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3400); }
  async function updateStatus(id,status){
    const token=getToken();
    if(!token){ openTokenModal(); toast("请先点 🔧 同步 填入 GitHub Token"); return; }
    toast("正在同步 "+id+" → "+status+" …");
    const url="https://api.github.com/repos/tengfeizhao1219/One-News/contents/docs/showcase/kanban/tasks.json";
    const headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json"};
    try{
      const r1=await fetch(url,{headers});
      if(r1.status===401||r1.status===403){ toast("❌ Token 无效或无权限（需 repo 权限）"); return; }
      if(r1.status===404){ toast("❌ 未找到 tasks.json"); return; }
      if(!r1.ok){ toast("❌ 读取失败 HTTP "+r1.status); return; }
      const j1=await r1.json(); const sha=j1.sha;
      const cur=JSON.parse(b64decodeUtf8(j1.content));
      const t=cur.tasks.find(x=>x.id===id); if(!t){ toast("❌ 未找到任务 "+id); return; }
      t.status=status;
      const body=b64encodeUtf8(JSON.stringify(cur,null,2));
      const r2=await fetch(url,{method:"PUT",headers,body:JSON.stringify({
        message:"chore(kanban): "+id+" 状态 → "+status, content:body, sha})});
      if(r2.status===401||r2.status===403){ toast("❌ Token 无效或无权限"); return; }
      if(r2.status===429){ toast("⏳ GitHub 限流，请稍后重试"); return; }
      if(!r2.ok){ toast("❌ 提交失败 HTTP "+r2.status); return; }
      toast("✅ 已同步（GitHub Pages 约 1–3 分钟后全网生效），即将刷新…");
      setTimeout(()=>location.reload(),1300);
    }catch(err){ toast("❌ 网络异常："+(err&&err.message?err.message:"无法连接 api.github.com")); }
  }
  } // end renderBoard
})();
</script>
</body>
</html>
