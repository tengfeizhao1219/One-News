<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif">
  <!-- 启动屏横排 · 深底（左右两侧文字距离边缘 = 24px 严格对齐） -->
  <rect width="640" height="120" rx="14" fill="#0D0D0D"/>
  <!-- 左侧主标：左对齐到 24px，纵向居中到 60px 中线 -->
  <text x="24" y="56" font-size="36" font-weight="900" fill="#FFFFFF">One</text>
  <line x1="24" y1="68" x2="124" y2="68" stroke="#0A84FF" stroke-width="3" stroke-linecap="round"/>
  <text x="24" y="88" font-size="9" fill="#8E8E93" letter-spacing="3">ONE · NEWS</text>
  <!-- 右侧 slogan：右对齐到 616px（右边距 24px） -->
  <text x="616" y="58" text-anchor="end" font-size="13" font-weight="400" fill="#FFFFFF" font-family="PingFang SC">一页，让阅读轻松一点</text>
  <text x="616" y="77" text-anchor="end" font-size="7" fill="#8E8E93" letter-spacing="1.5">Pure reading, One News</text>
</svg>
