<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif">
  <!-- 启动屏横排 · 深底（左右两侧文字距离边缘 = 24px 严格对齐）
       owner 2026-09-09 重设计定稿（方案B 主次对调）：右 slogan 22px 升为主视觉，
       左 One 22px 紧凑角标（下划线 58px）——修复左右大小不协调 -->
  <rect width="640" height="120" rx="14" fill="#0D0D0D"/>
  <!-- 左侧品牌角标：左对齐 24px -->
  <text x="24" y="52" font-size="22" font-weight="900" fill="#FFFFFF">One</text>
  <line x1="24" y1="63" x2="82" y2="63" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="24" y="81" font-size="7.5" fill="#8E8E93" letter-spacing="2.5">ONE · NEWS</text>
  <!-- 右侧 slogan：右对齐 616px（右边距 24px）——主视觉 -->
  <text x="616" y="64" text-anchor="end" font-size="22" font-weight="400" fill="#FFFFFF" font-family="PingFang SC">一页，让阅读轻松一点</text>
  <text x="616" y="88" text-anchor="end" font-size="10" fill="#8E8E93" letter-spacing="1.5">Pure reading, One News</text>
</svg>
